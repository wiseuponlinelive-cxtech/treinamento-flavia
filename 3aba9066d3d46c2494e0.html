<title>FlavIA para Analista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: réplica da casca da FlavIA (menu lateral + barra superior) com telas de exemplo; abaixo de cada tela, o guia "como usar". Visual claro do produto, um tema só. */
:root{
  color-scheme:light;
  --bg:#F8F9F9; --surface:#FFFFFF; --surface-2:#FAFAFB; --line:#EEEEEF; --line-2:#DCDCE2;
  --ink:#0C1E29; --ink-2:#333B44; --muted:#898A9A; --muted-2:#5F6072;
  --brand:#621DC9; --brand-hover:#4E14A6; --brand-soft:#F1E9FC; --brand-on:#E4D5F8; --brand-line:#D9C5F6;
  --pill:#BDBFC6; --ok:#0F7B72; --danger:#C0392B; --danger-soft:#FDECEA; --warn:#94570A; --warn-bg:#FCF1DE; --code-bg:#F4F3F8;
  --font:"Roboto","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
  --side:232px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 0 18px;z-index:40;overflow-y:auto}
.side .logo{display:flex;justify-content:center;padding:0 0 24px}
.side .sec{font-size:12px;letter-spacing:.4px;color:var(--ink);padding:6px 32px 8px}
.side .it{display:flex;align-items:center;gap:14px;width:calc(100% - 32px);margin:1px 16px;padding:8px 13px;border-radius:4px;border:0;background:none;color:var(--ink);font-size:13.5px;text-align:left;cursor:pointer}
.side .it:hover{background:var(--surface-2)}
.side .it svg{width:16px;height:16px;color:var(--muted);flex:none}
.side .it .lb{flex:1}
.side .it .car{width:14px;height:14px}
.side .it.sub{padding-left:43px;font-size:13px}
.side .it.on{background:var(--brand-on);color:var(--brand);font-weight:500}
.side .it.on svg{color:var(--brand)}
.side .grow{flex:1;min-height:24px}
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.top .ver{font-size:13px;color:var(--muted)}
.top .demo{font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:3px 10px;white-space:nowrap}
.top .sp{flex:1}
.top .acc{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);white-space:nowrap}
.top .acc svg{width:16px;height:16px}
.top .user{display:flex;align-items:center;gap:14px;min-width:0}
.top .mail{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;font-size:13px;min-width:0}
.top .mail small{font-size:10.5px}
.top .av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}

.page{padding-block:22px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));max-width:1280px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:12px}
.crumb b{color:var(--ink);font-weight:400}
.head{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:32px;font-weight:400;letter-spacing:-.2px}
.head .count{font-size:12px;border:1px solid var(--line-2);border-radius:999px;padding:1px 9px;color:var(--muted-2)}
.head .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:4px;border:1px solid var(--brand);background:var(--surface);color:var(--brand);font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--brand-soft)}
.btn.solid{background:var(--brand);color:#fff}
.btn.solid:hover{background:var(--brand-hover)}
.btn.ghost{border-color:transparent}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn svg{width:16px;height:16px}
.views{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;margin-bottom:14px;background:var(--surface);flex-wrap:wrap}
.views button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted-2);cursor:pointer}
.views button.on{background:var(--brand);color:#fff}
.views span{font-size:12px;color:var(--muted);padding:6px 10px 6px 12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;min-width:0}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:13px;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .lnk{color:var(--brand)}
td.dots{color:var(--muted);text-align:right;font-size:18px;letter-spacing:1px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;line-height:1.4;white-space:nowrap}
.pill.gray{background:var(--pill);color:#fff}
.pill.out{border:1px solid var(--line-2);color:var(--muted-2)}
.pill.ok{background:var(--ok);color:#fff}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.mono{font-family:var(--mono);font-size:12.5px}

.form{display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:12.5px;color:var(--ink-2)}
.fld label i{color:var(--danger);font-style:normal;margin-right:3px}
.fld .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fld .row a{font-size:12px;color:var(--brand)}
.in{border:1px solid var(--line-2);border-radius:4px;background:var(--surface);padding:9px 11px;font-size:13.5px;color:var(--ink);min-height:38px;display:flex;align-items:center;gap:8px;min-width:0}
.in.sel::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);flex:none}
.in.area{display:block;white-space:pre-wrap;line-height:1.55;max-height:180px;overflow:auto;font-size:13px}
.in.area.tall{max-height:240px}
.in .pre{color:var(--muted-2);background:var(--surface-2);border-right:1px solid var(--line-2);margin:-9px 0 -9px -11px;padding:9px 11px;white-space:nowrap}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:6px;padding:16px}
.box .bt{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-2);font-weight:500;margin-bottom:12px}
.code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);border-radius:4px;padding:12px 14px;white-space:pre;overflow-x:auto;line-height:1.6}
.hint{font-size:12px;color:var(--muted-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:4px;overflow:hidden}
.seg span{padding:7px 12px;font-size:13px;border-right:1px solid var(--line-2)}
.seg span:last-child{border-right:0}
.seg span.on{background:var(--brand);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--brand-soft);color:var(--brand)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.toggle b{width:34px;height:18px;border-radius:9px;background:var(--brand);position:relative;display:inline-block}
.toggle b::after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.toggle.off b{background:var(--pill)}
.toggle.off b::after{right:auto;left:2px}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line-2);margin:18px 0 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs span{padding:10px 16px;font-size:13.5px;color:var(--muted-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs span.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:500}
.kv{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:10px 18px;font-size:13.5px}
.kv dt{color:var(--muted-2)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.icard{border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.icard h3{margin:0;font-size:15px;font-weight:500}
.icard p{margin:0;color:var(--muted-2);font-size:13px}
.url{display:flex;gap:8px;align-items:center}
.url .in{flex:1;font-family:var(--mono);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block;line-height:20px}
.welcome{padding:26px 4px 6px;text-align:center}
.welcome h1{margin:0;font-size:32px;font-weight:700;line-height:1.1}
.welcome p{margin:2px 0 0;color:var(--ink-2);font-size:16px}
.hsearch{display:flex;gap:8px;margin-left:auto;flex:1 1 360px;max-width:640px}
.hsearch .in{flex:1}
.res{border:1px solid var(--line);border-radius:4px;padding:12px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface)}
.res:hover{border-color:var(--brand-line)}
.res b{font-weight:500}
.res small{color:var(--muted)}
.res+.res{margin-top:8px}
.st{display:inline-block;font-size:11.5px;color:#fff;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:1px}
.st.and{background:#3346D3}.st.ab{background:#3346D3}.st.per{background:#C8102E}.st.gan{background:#0F7B72}.st.tes{background:#C6C8CF}
.back{font-size:12.5px;color:var(--brand);background:none;border:0;padding:0;cursor:pointer;margin:0 0 10px 16px}
.dkv{display:grid;grid-template-columns:minmax(150px,216px) 1fr;gap:12px 16px;font-size:13.5px;margin-top:14px}
.dkv dt{color:var(--muted)}
.dkv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dkv a,.lk{color:var(--brand)}
.resumo{background:#EEEEF0;padding:10px 8px;margin-top:20px}
.resumo small{display:block;color:var(--muted);margin-bottom:6px}
.sbtn{display:inline-block;border:1px solid var(--brand);color:var(--brand);background:var(--surface);border-radius:2px;font-size:12px;padding:3px 16px;margin:14px 8px 0 0}
.show2{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px}
.show2 .f small{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.show2 .f div{font-size:14px;min-height:20px;overflow-wrap:anywhere}
.show2 .full{grid-column:1/-1}
.md{border:1px solid var(--line-2);background:var(--surface-2);border-radius:2px;padding:16px 20px;max-height:300px;overflow:auto}
.md h3{font-size:17px;font-weight:500;margin:4px 0 10px}
.md h2{font-size:24px;font-weight:700;margin:16px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.md ul{margin:0 0 8px;padding-left:22px}
.mono-area{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;line-height:1.65}
.hist{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:2px;padding:8px 18px;font-size:13.5px;color:var(--ink-2);width:max-content}
.center{display:flex;justify-content:center;margin-top:8px}
.modal{border:1px solid var(--line);border-radius:6px;background:var(--surface);box-shadow:0 10px 30px rgba(12,30,41,.14);overflow:hidden}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);font-size:17px;font-weight:500}
.modal .mh span{color:var(--muted);font-weight:400}
.modal .vh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 22px 0;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0}
.modal .vh b{font-weight:500;display:block}
.modal .vh small{color:var(--muted-2)}
.btnBlue{background:#3D84E8;color:#fff;border:0;border-radius:3px;padding:8px 16px;font-size:13.5px}
.diff{margin:0 22px 20px;border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;font-family:var(--mono);font-size:12px;overflow-x:auto}
.diff .c{min-width:240px}
.diff .c>div:first-child{padding:8px 8px;border-bottom:1px solid var(--line)}
.diff .l{display:grid;grid-template-columns:34px 1fr;padding:2px 0}
.diff .l i{color:var(--muted);font-style:normal;text-align:center}
.diff .old .l{background:#FDECEA}.diff .new .l{background:#D9F7DE}
.chk{display:inline-flex;align-items:center;gap:10px;font-size:13px}
.chk b{width:18px;height:18px;border:1px solid var(--line-2);border-radius:3px;display:inline-grid;place-items:center;background:var(--surface)}
.chk.on b{background:var(--brand);border-color:var(--brand)}
.chk.on b::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.q{display:inline-grid;place-items:center;width:15px;height:15px;border:1.5px solid #3346D3;color:#3346D3;border-radius:50%;font-size:10px;font-weight:700;margin-left:4px}
.slider{display:flex;align-items:center;gap:14px;font-size:13px}
.slider i{flex:1;height:6px;border-radius:3px;background:var(--line-2);position:relative}
.slider i::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4%;background:#3D84E8;border-radius:3px}
.slider i::after{content:"";position:absolute;left:3%;top:-5px;width:16px;height:16px;border-radius:50%;background:#3D84E8}
.cal::after{content:"📅";margin-left:auto;font-size:13px}
.ico{display:inline-flex;gap:14px;color:var(--brand);justify-content:flex-end}
.ico svg{width:16px;height:16px}
.ico .del{color:var(--danger)}
.sync{color:var(--brand);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.sync svg{width:14px;height:14px}
.appr{background:#0F7B72;color:#fff;font-size:11.5px;font-weight:500;border-radius:999px;padding:3px 9px}
.xbtn{border:1px solid var(--danger);color:var(--danger);background:var(--surface);border-radius:2px;font-size:12px;padding:2px 14px}
.tplwrap{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.tplwrap{grid-template-columns:1fr}.show2{grid-template-columns:1fr}.dkv{grid-template-columns:1fr}}
.sech{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-2);font-weight:500;margin:6px 0 2px;padding-top:16px;border-top:1px solid var(--line)}
.opt{color:var(--muted);font-size:11px;margin-left:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:#E7F6EC;color:#127A4B;border-radius:999px;padding:2px 10px;width:max-content}
.prev{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:22px}
.prev h3{margin:0;font-size:17px;font-weight:700}
.prev p{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
.bubble{margin-top:18px;background:#E7F8DC;border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.5;max-width:300px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bubble small{display:block;text-align:right;color:var(--muted);font-size:11px;margin-top:4px}
.search{display:flex;gap:10px;flex-wrap:wrap}
.search .in{flex:1 1 280px}

.guide{margin-top:22px;background:var(--surface);border:1px solid var(--brand-line);border-radius:8px;padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 28px}
@media (max-width:900px){.guide{grid-template-columns:1fr}}
.guide .gt{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--brand)}
.guide .gt svg{width:16px;height:16px}
.guide h3{margin:0 0 6px;font-size:14px;font-weight:500}
.guide p{margin:0;color:var(--ink-2);max-width:66ch}
.guide ol{margin:0;padding-left:20px;color:var(--ink-2)}
.guide li+li{margin-top:4px}
.guide .care{grid-column:1/-1;border-left:3px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:0 6px 6px 0;color:var(--ink-2)}
.steps{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s;max-width:720px}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:500;font-size:13px;display:grid;place-items:center}
.steps b{font-weight:500}
.steps span{display:block;color:var(--ink-2)}
.steps button{border:0;background:none;color:var(--brand);padding:0;font-size:13px;cursor:pointer}
.steps button:hover{text-decoration:underline}

@media (max-width:960px){
  .side{position:static;width:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:4px}
  .side .logo,.side .sec,.side .grow{display:none}
  .side .it{width:auto;margin:0;padding:7px 10px}
  .side .it.sub{padding-left:10px}
  .side .it .car{display:none}
  .main{margin-left:0}
  .top .mail{display:none}
  .top{gap:10px}
  .top .ver{display:none}
  .top .acc{font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head h1{font-size:26px}
  .kv{grid-template-columns:1fr}
}

.menuPop{position:absolute;right:0;top:44px;background:var(--surface);box-shadow:0 6px 20px rgba(12,30,41,.14);border-radius:4px;display:flex;flex-direction:column;min-width:130px;z-index:2;text-align:left}
.menuPop span{display:flex;gap:8px;align-items:center;padding:12px 18px;font-size:13.5px;color:var(--ink)}
.menuPop span svg{width:15px;height:15px}
.menuPop .del{color:var(--danger)}
.dash{display:inline-block;border:1px dashed var(--line-2);border-radius:3px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);margin-top:12px;width:max-content}
.fmt{border:1px solid var(--line-2);border-radius:3px;font-size:11.5px;padding:3px 10px}
.ed{border:1px solid var(--line-2);border-radius:3px;font-family:var(--mono);font-size:12px;min-height:130px;padding:8px 0;background:var(--surface);overflow-x:auto}
.ed div{display:grid;grid-template-columns:38px 1fr;line-height:1.6;white-space:pre}
.ed i{font-style:normal;color:var(--muted);text-align:center;border-right:1px solid var(--line);margin-right:10px;background:var(--surface-2)}
.ed mark{background:#DDF5E3;border:1px solid #9AD8AB;border-radius:3px;color:#126B3E;padding:0 2px}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:12px;color:var(--muted-2)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:3px;display:inline-block}

    {r:'A G T', s:'ferramenta', v:'editar', boxi:2, t:'Parâmetros da requisição', d:'O corpo enviado. Variáveis em verde são substituídas na hora; em amarelo vão como texto. Digite {{ para ver as variáveis.'},
    {r:'A G T', s:'ferramenta', v:'editar', boxi:3, t:'Resposta para o agente', d:'O que volta para o agente: só a confirmação, um atributo ou o JSON completo. Use Testar tool antes de salvar.'},
    {r:'A G', s:'chatwoot', sel:'.side .it[data-id="chatwoot"]', t:'Chatwoot', d:'Este item do menu não abre uma tela da FlavIA: é um atalho que leva direto para as conversas no Chatwoot da conta.'},
    {r:'A G An', s:'integracoes', sel:'.cards', t:'Integrações', d:'Recebem leads (Webhook de Oportunidades) e vendas (Webhook de Conversões) de outras plataformas, como Kiwify, MercuryPay e Tally.'},
    {r:'A G An', s:'integracoes', txt:'Copiar', t:'Copiar a URL', d:'No webhook de Oportunidades, escolha a campanha que vai receber os leads. Copie a URL e cole nas configurações da plataforma de origem.'},
    {r:'A G An', s:'integracoes', sel:'.comouse', t:'Como usar', d:'O passo a passo fica no fim da página: copiar, colar na plataforma externa, salvar e testar.'},
    {r:'A G An', s:'inboxes', sel:'.sync', t:'Inboxes', d:'As caixas do Chatwoot da conta. Sincronizar com Chatwoot atualiza os templates de WhatsApp da caixa.'},
    {r:'A G', s:'guia', sel:'.glist', t:'Assuntos do guia', d:'Na lateral ficam todos os artigos, separados por assunto, com uma busca no topo.'},
    {r:'A G', s:'guia', sel:'.gmain', t:'Guia do Usuário', d:'Cada artigo diz para quem é, onde fica na FlavIA e o passo a passo. Consulte sempre que tiver dúvida.'}
  ].filter(x=>R(x.r||ALL));

  /* ---------- render ---------- */
  const $ = id => document.getElementById(id);
  let step = -1;   // -1 = abertura, STEPS.length = fim
  function renderMenu(){
    $('menu').innerHTML = VIS.map(m=>{
      if (m.sec) return `<div class="sec">${m.sec}</div>`;
      if (m.grp) return `<div class="it" style="cursor:default">${svg(m.ic)}<span class="lb">${m.grp}</span>${svg('up','car')}</div>`;
      return `<button type="button" class="it${m.sub?' sub':''}${m.id===cur?' on':''}" data-id="${m.id}">${m.sub?'':svg(m.ic)}<span class="lb">${m.lb}</span></button>`;
    }).join('') + '<div class="grow"></div>';
  }
  function renderPage(){ $('page').innerHTML = S[cur](); }
  function findTarget(x){
    const pg = $('page');
    if (x.sel) return (x.sel.startsWith('.top')||x.sel.startsWith('.side')) ? document.querySelector(x.sel) : pg.querySelector(x.sel);
    if (x.fld){ const l = [...pg.querySelectorAll('.fld label')].find(e=>e.textContent.replace('*','').trim().startsWith(x.fld)); return l ? l.closest('.fld') : null; }
    if (x.th) return [...pg.querySelectorAll('th')].find(e=>e.textContent.trim()===x.th);
    if (x.boxi!=null) return pg.querySelectorAll('.box')[x.boxi];
    if (x.txt){ const e = [...pg.querySelectorAll('button, a, span, h2, dd, .sbtn')].filter(e=>e.textContent.trim().startsWith(x.txt)).sort((a,b)=>a.textContent.length-b.textContent.length)[0]; return e && x.box ? e.closest('.panel') : e; }
    return null;
  }
  function paint(){
    document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));
    const intro = step<0, fim = step>=STEPS.length;
    $('ov').hidden = !(intro||fim);
    $('tbar').hidden = intro||fim;
    if (intro){ $('ovBody').innerHTML = INTRO; return; }
    if (fim){ $('ovBody').innerHTML = FIM; return; }
    const x = STEPS[step];
    cur = x.s; if (x.v) view[x.s] = x.v;
    renderMenu(); renderPage();
    $('tN').textContent = `Passo ${step+1} de ${STEPS.length}`;
    $('tT').textContent = x.t; $('tD').textContent = x.d;
    $('tTec').hidden = !(['webhook','credencial','ferramenta'].includes(x.s) && (ROLE==='A'||ROLE==='G'));
    $('tProg').style.width = ((step+1)/STEPS.length*100)+'%';
    $('tPrev').disabled = false;
    $('tNext').textContent = step===STEPS.length-1 ? 'Concluir' : 'Próximo →';
    const el = findTarget(x);
    if (el){ el.classList.add('tour-hl'); requestAnimationFrame(()=>el.scrollIntoView({block:'center',behavior:'smooth'})); }
    else window.scrollTo({top:0});
    try{ localStorage.setItem('fvTour_'+ROLE, String(step)); }catch(_){}
  }
  const move = d => { step = Math.max(-1, Math.min(STEPS.length, step+d)); paint(); };
  const INTRO = `<span class="ovTag">Treinamento FlavIA</span><h2>Vamos conhecer a FlavIA juntos</h2>
    <p>As telas a seguir são iguais às da FlavIA, preenchidas com dados de exemplo. Nada do que aparece aqui é real e nada que você fizer aqui muda o sistema.</p>
    <ol class="ovList"><li><b>Siga o roteiro.</b> São ${STEPS.length} passos, na ordem do menu: começamos pelo topo da tela e terminamos nas últimas páginas.</li><li><b>Olhe o destaque.</b> Em cada passo, a parte da tela que estamos explicando fica contornada em roxo, e a explicação aparece na barra de baixo.</li><li><b>Avance no seu ritmo.</b> Use as setas → e ← do teclado ou os botões Próximo e Anterior.</li>${(ROLE==='A'||ROLE==='G')?'<li><b>Seu foco no dia a dia: Prompt, Campanha e Templates.</b> Webhook, Credencial e Ferramenta são do time de tecnologia: aparecem marcadas em amarelo e são só para consulta.</li>':''}</ol>
    <div class="ovAct"><button class="btn solid big" type="button" data-start>Começar o treinamento →</button></div>`;
  const FIM = `<span class="ovTag">Treinamento concluído</span><h2>Pronto, você passou por toda a FlavIA</h2><p>Agora é praticar na FlavIA de verdade. Lembre de conferir a conta no topo antes de mexer e de publicar o prompt depois de salvar.</p><div class="ovAct"><button class="btn" type="button" data-restart>Recomeçar do início</button><button class="btn solid" type="button" data-back>Voltar ao último passo</button></div>`;
  document.addEventListener('click', e=>{
    if (e.target.closest('[data-start]')){ step = 0; paint(); return; }
    if (e.target.closest('[data-restart]')){ step = -1; paint(); return; }
    if (e.target.closest('[data-back]')){ step = STEPS.length-1; paint(); return; }
    if (e.target.closest('#tNext')){ move(1); return; }
    if (e.target.closest('#tPrev')){ move(-1); return; }
    const m = e.target.closest('[data-id]');
    if (m){ const i = STEPS.findIndex(x=>x.s===m.dataset.id); if (i>=0){ step = i; paint(); } }
  });
  document.addEventListener('keydown', e=>{
    if (e.key==='ArrowRight'){ e.preventDefault(); move(1); }
    else if (e.key==='ArrowLeft'){ e.preventDefault(); move(-1); }
    else if (e.key==='Enter' && step<0){ step = 0; paint(); }
  });
  try{ const s = parseInt(localStorage.getItem('fvTour_'+ROLE),10); if (s>=0 && s<STEPS.length) step = -1; }catch(_){}
  renderMenu(); renderPage(); paint();
})();
</script>
